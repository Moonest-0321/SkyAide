<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>天相星 SkyAide 簡報</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
/* Layout: a fixed 1600x900 stage scaled to fit the window (no scrolling); detail pages open as a scrollable reading layer */
:root{
  --bg:#DDE3EA; --paper:#FAFAF7; --card:#FFFFFF; --ink:#14213D; --muted:#4F5B70; --line:#D3D9E2;
  --accent:#2C5BBA; --warm:#B4511A; --good:#2E7D4F; --band:#EFF2F6;
  --inv-bg:#14213D; --inv-fg:#F3F5F8; --inv-muted:#B7C2D6; --inv-accent:#9DBDF7;
  --f-display:'Noto Serif TC','Songti TC',Georgia,serif;
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A101C; --paper:#131C2E; --card:#1A253C; --ink:#E7EBF2; --muted:#A5AFC1; --line:#2C3853;
  --accent:#8EAEF2; --warm:#F09A62; --good:#7BCB98; --band:#18223A;
  --inv-bg:#1F3A75; --inv-fg:#F3F5F8; --inv-muted:#C4D0E6; --inv-accent:#BFD3FA; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A101C; --paper:#131C2E; --card:#1A253C; --ink:#E7EBF2; --muted:#A5AFC1; --line:#2C3853;
  --accent:#8EAEF2; --warm:#F09A62; --good:#7BCB98; --band:#18223A;
  --inv-bg:#1F3A75; --inv-fg:#F3F5F8; --inv-muted:#C4D0E6; --inv-accent:#BFD3FA; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.5;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* stage */
#vp{position:fixed;inset:0 0 40px 0;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0}
.slide{position:absolute;inset:0;background:var(--paper);color:var(--ink);padding:64px 80px 100px;display:flex;flex-direction:column;gap:40px;overflow:hidden;border-radius:6px}
.slide.inv{background:var(--inv-bg);color:var(--inv-fg);justify-content:center}
.slide h1{font-family:var(--f-display);font-weight:900;font-size:96px;line-height:1.1}
.slide h2{font-family:var(--f-display);font-weight:900;font-size:56px;line-height:1.2;text-wrap:balance}
.slide h3{font-size:32px;font-weight:700;line-height:1.3}
.slide p,.slide li,.slide td,.slide th{font-size:28px;line-height:1.5}
.slide .lead{color:var(--muted)}
.slide.inv .lead{color:var(--inv-muted)}
.slide .sec{font-size:20px!important;letter-spacing:.16em;font-weight:700;color:var(--accent);margin-bottom:-28px}
.slide .eyebrow{font-size:22px;letter-spacing:.2em;color:var(--inv-accent)}
.slide .src{font-size:19px;line-height:1.45;color:var(--muted)}
.slide.inv .src{color:var(--inv-muted)}
.slide .src a{color:inherit}
.foot{position:absolute;left:80px;right:80px;bottom:30px;display:flex;gap:20px;align-items:baseline}
.foot .pg{font-size:19px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:44px}
.slide.inv .foot .pg{color:var(--inv-muted)}
.foot .src{flex:1}

.row{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:30px 32px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.hot{border:2px solid var(--warm)}
.card.top-a{border-top:6px solid var(--accent)}
.card.top-w{border-top:6px solid var(--warm)}
.card.top-g{border-top:6px solid var(--good)}
.card.dark{background:var(--inv-bg);color:var(--inv-fg);border-color:transparent}
.card.dark p{color:var(--inv-muted)}
.slide .big{font-weight:900;font-size:88px;line-height:1.05;font-variant-numeric:tabular-nums}
.slide .big.mid{font-size:64px}
.c-a{color:var(--accent)}.c-w{color:var(--warm)}.c-g{color:var(--good)}

a.go{color:inherit;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px;cursor:pointer}
a.go::after{content:"↗";color:var(--accent);font-weight:700;margin-left:2px}
.slide.inv a.go,.card.dark a.go{text-decoration-color:var(--inv-accent)}
.slide.inv a.go::after,.card.dark a.go::after{color:var(--inv-accent)}
.src a.go{text-decoration-thickness:1px}

.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-weight:700;border-bottom:2px solid var(--ink);padding:12px 14px;font-size:24px!important}
.tbl td{border-bottom:1px solid var(--line);padding:14px 14px;vertical-align:top;font-size:24px!important;line-height:1.4!important}
.tbl tr:nth-child(even) td{background:var(--band)}
.tbl td.s{font-size:18px!important;color:var(--muted)}
.tbl td.s a{color:inherit}

.bars{display:flex;flex-direction:column;gap:24px}
.bars .r{display:grid;grid-template-columns:290px 1fr 160px 320px;align-items:center;gap:18px}
.bars .lab{text-align:right;font-size:27px}
.bars .track{height:52px;background:var(--band);border-radius:6px;overflow:hidden}
.bars .fill{height:100%;background:var(--muted);opacity:.5}
.bars .fill.a{background:var(--accent);opacity:1}
.bars .val{font-weight:700;font-size:28px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bars .src{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.flow{display:grid;grid-template-columns:1fr 50px 1fr 50px 1.15fr;gap:12px;align-items:stretch}
.flow .arr{align-self:center;text-align:center;font-size:40px;color:var(--muted)}

.tl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 28px}
.step{border-top:6px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.step.done{border-top-color:var(--good)}
.step.now{border-top-color:var(--warm)}
.step .d{font-size:21px!important;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:18px!important;font-weight:700;padding:2px 10px;border-radius:999px;border:1.5px solid currentColor;width:max-content}

/* bottom bar */
#bar{position:fixed;left:0;right:0;bottom:0;height:40px;display:flex;align-items:center;gap:10px;padding:0 max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));font-size:13px;color:var(--muted)}
#bar .brand{font-weight:700;color:var(--ink)}
#bar .sp{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:4px 12px;border-radius:999px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn[disabled]{opacity:.4;cursor:default}
#count{font-variant-numeric:tabular-nums;min-width:48px;text-align:center}

/* detail layer */
#detail{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
#detail .sheet{max-width:52rem;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:clamp(20px,4vw,44px);display:flex;flex-direction:column;gap:16px}
#detail .tag{display:inline-block;font-size:12px;letter-spacing:.12em;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);width:max-content}
#detail .tag.ext{border-color:var(--accent);color:var(--accent)}
#detail h1{font-family:var(--f-display);font-weight:900;font-size:clamp(24px,3.2vw,34px);line-height:1.25;text-wrap:balance}
#detail h2{font-size:18px;font-weight:700;margin-top:10px}
#detail p,#detail li{font-size:16px;line-height:1.75}
#detail ul,#detail ol{padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
#detail .meta{color:var(--muted);font-size:14px}
#detail .srcbox{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
#detail .srcbox .u{font-size:13px;color:var(--muted);word-break:break-all;user-select:all}
#detail .tw{overflow-x:auto}
#detail table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
#detail th{text-align:left;border-bottom:2px solid var(--ink);padding:6px 8px}
#detail td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
#detail .note{font-size:14px;color:var(--muted);border-left:3px solid var(--line);padding-left:12px}
#detail .note::before{content:"整理者註：";font-weight:700}
#detail .backrow{display:flex;gap:10px;flex-wrap:wrap}
#detail .btn{font-size:14px;padding:7px 14px}
</style>

<div id="vp" aria-live="polite"><div id="stage"></div></div>
<div id="bar">
  <span class="brand">天相星 SkyAide</span>
  <span class="sp" id="hint">← → 換頁　點畫底線、標 ↗ 的資訊看依據</span>
  <button class="btn" id="prev" aria-label="上一頁">←</button>
  <span id="count">1 / 20</span>
  <button class="btn" id="next" aria-label="下一頁">→</button>
  <button class="btn" id="all">所有依據</button>
</div>
<div id="detail" hidden tabindex="-1"></div>

<script>
const R = 'https://claude.ai/code/artifact/ad3e23de-020e-4158-8216-42d832574372';
const SLIDES = [
{ t:'封面', inv:true, h:`

{ t:'三個重點', h:`

<div class="row">
 <div class="card top-a"><p class="big mid c-a">一</p><h3>資金比對</h3><p class="lead">損失多少、經費夠不夠、錢卡在哪</p><p class="src">關鍵數字：<a class="go" href="#d-udn-relief">丹娜絲災後 86 天，核撥只有初勘合格金額的 58.6%</a></p></div>

 <div class="card top-a"><p class="big mid c-a">三</p><h3>處理方向</h3><p class="lead">天相星用衛星證據，讓沒有爭議的案件免現勘</p><p class="src">關鍵數字：<a class="go" href="#d-cy-audit">免勘案件平均 24–30 天撥款</a></p></div>

{ t:'2025 年農損', h:`

<h2>2025 年五起颱風豪雨，農損合計 50.66 億元</h2>

 <div class="r"><span class="lab">0728 豪雨</span><div class="track"><div class="fill" style="width:15.0%"></div></div><span class="val">4.94 億</span><span class="src">依據：<a class="go" href="#d-moa-0728">農業部最末報 8/11</a></span></div>
 <div class="r"><span class="lab">鳳凰颱風</span><div class="track"><div class="fill" style="width:3.8%"></div></div><span class="val">1.24 億</span><span class="src">依據：<a class="go" href="#d-fengwong">農業部速報 11/14</a></span></div>
</div>
<p class="lead">丹娜絲一起占 64.8%（32.81 ÷ 50.66）。寒害沒有單一報告，但<a class="go" href="#d-cna-budget">部長表示年初低溫已用掉約 22 億救助經費</a>，全年預算約 39 億。</p>

{ t:'經費夠不夠', h:`
<p class="sec">一｜資金比對</p>
<h2>救助經費年年不夠，2025 年年初就用掉一半以上</h2>
<div class="row">
 <div class="card"><p class="big mid">39 億</p><p>2025 年農業災害救助預算</p><p class="src">依據：<a class="go" href="#d-cna-budget">農業部長立法院答詢（中央社 2025/7/21）</a></p></div>

 <div class="card"><p class="big mid">71.23 億</p><p>丹娜絲＋0708 豪雨現金救助經費，約 9,400 戶</p><p class="src">依據：<a class="go" href="#d-udn-relief">農業部長 2025/10/13 立法院報告</a></p></div>
</div>
<div class="row" style="--n:2">
 <div class="card"><p class="big mid">90.5 → 163.71 億</p><p>2017–2022 年救助預算 vs 實際支出，六年中五年超支</p><p class="src">依據：<a class="go" href="#d-cy-audit">監察院調查報告</a></p></div>
 <div class="card"><p class="big mid">約 28%</p><p>近 5 年平均每年農損 123 億，現金救助約 34 億</p><p class="src">依據：<a class="go" href="#d-agri-ratio">時任農委會主委說法（農傳媒 2021）</a>；34 ÷ 123 為整理者計算</p></div>
</div>
<div class="foot"><span class="pg">04</span><span class="src">救助額度本來就只補一部分：<a class="go" href="#d-cy-audit">約為平均生產成本的 2 成</a>。損失為速報估計，與救助經費統計口徑不同，不宜直接相減。</span></div>`},

{ t:'丹娜絲只撥 59%', h:`
<p class="sec">一｜資金比對</p>
<h2>丹娜絲災後 86 天，只撥出初勘合格金額的 59%</h2>
<div class="bars">
 <div class="r" style="grid-template-columns:280px 1fr 260px"><span class="lab">公所初勘合格</span><div class="track" style="height:64px"><div class="fill" style="width:100%"></div></div><span class="val">51.5 億</span></div>

</div>
<p class="lead">三分之一的錢卡在「公所勘查 → 縣府提報」；已提報的部分，農業部核撥率 87.2%（30.18 ÷ 34.6）。</p>

<div class="row">
 <div class="card"><p class="big">1 天</p><p>颱風過境到公告救助</p><p class="src">依據：丹娜絲 7/6 登陸、<a class="go" href="#d-agri-first">7/7 晚間公告</a>；樺加沙 9/23 溢流、<a class="go" href="#d-udn-ragasa">9/24 公告</a>；楊柳 8/13 過境、<a class="go" href="#d-ltn-yangliu">8/14 公告</a></p></div>

</div>
<p class="lead">慢的不是公告，是公告之後的勘查、抽查與提報。2025 年各案的撥款天數未公開，55 天是目前唯一的全國逐案統計。</p>

{ t:'兩個極端', h:`

  <p><b>24 天</b>　<a class="go" href="#d-cy-audit">視同具種植事實案件的平均撥款天數（2021 年 1,716 件）</a></p></div>

{ t:'天相星做法', h:`
<p class="sec">三｜處理方向</p>
<h2>天相星：同一份衛星證據，證明種植事實與損失率</h2>
<div class="flow">
 <div class="card"><h3>災前影像</h3><p class="lead">作物判釋，綁定地號坵塊</p><p><b>→ 種植事實</b></p></div>
 <span class="arr" aria-hidden="true">→</span>
 <div class="card"><h3>災後影像</h3><p class="lead">SAR 雷達穿雲＋光學植生差異</p><p><b>→ 損失率</b></p></div>
 <span class="arr" aria-hidden="true">→</span>
 <div class="card dark"><h3 style="color:var(--inv-fg)">三級分流</h3><p><b style="color:var(--inv-fg)">A 明確受損</b>　估損 ≥ 40% → 存證送件</p><p><b style="color:var(--inv-fg)">B 明確未受損</b>　≤ 10% → 不派人</p><p><b style="color:var(--inv-fg)">C 爭議</b>　10–40%、影像不清、申報不符 → 優先現勘</p></div>
</div>
<p class="lead">為什麼是 20%：<a class="go" href="#d-moa-20pct">救助公告：損失率達 20% 以上才救助</a>，A／B 刻意離門檻夠遠，邊緣案件一律交給人判定。</p>
<div class="foot"><span class="pg">12</span><span class="src">10%／40% 為本隊建議起始值，需以丹娜絲等歷史災例校正（<a class="go" href="#d-team-plan">本隊評估報告</a>）｜<a class="go" href="#r-evidence">證明文件內容</a></span></div>`},

ext('d-udn-relief',{title:'丹娜絲、0708 豪雨救助經費 71.23 億元',pub:'經濟日報',date:'2025/10/13',

ext('d-cy-audit',{title:'監察院調查：農業天然災害現金救助撥款逾期等問題',pub:'監察院（依審計部 110 年度決算審核報告）',date:'2023/6/7',
url:'https://cybsbox.cy.gov.tw/CYBSBoxSSL/edoc/download/61399',body:`
<p>這是目前唯一逐案統計「申請到撥款」天數的官方資料，樣本為 2021 年 8 月上旬西南氣流豪雨。</p>
<h2>法定時程（救助辦法第 12 條）</h2>
<ul><li>農民：公告翌日起 10 日內申請</li><li>公所：公告翌日起 30 日內完成勘查</li><li>縣市：收件翌日起 7 日內抽查</li><li>農委會（現農業部）：收件翌日起 7 日內審核撥款</li><li>合計 44 天；農委會另依作業要點算為公告後 58 天</li></ul>
<h2>實際撥款天數</h2>
<table><tr><th>案件類型</th><th>件數</th><th>平均天數</th></tr>
<tr><td>全部</td><td>209,189</td><td>55</td></tr><tr><td>須現勘損失率的一般案件</td><td>134,006</td><td>58</td></tr>
<tr><td>簡化措施但仍現勘種植事實</td><td>67,535</td><td>51</td></tr><tr><td>有客觀證明、免勘查</td><td>5,932</td><td>30</td></tr>
<tr><td>無證明、視同具種植事實</td><td>1,716</td><td>24</td></tr></table>
<ul><li>縣市差距大：嘉義縣平均 72 天最慢，桃園市 12 天最快</li><li>181 件撥款超過 58 天，最長 100 天</li></ul>
<h2>公所人力</h2>
<ul><li>該次申請土地 32 萬 7,230 筆，由 221 個公所辦理</li><li>公所農業課平均編制 4 人，每人約處理 370 筆，還要兼辦農情調查、推廣等業務</li></ul>
<h2>其他發現</h2>
<ul><li>未達豪雨標準仍獲救助 36,059 件、2.61 億元，其中 11,696 件免現勘</li>
<li>10 個縣市因擔心溢領、未種植仍申報，幾乎都維持逐筆現勘，簡化措施效果打折</li>
<li>2019–2020 年無人機輔助勘災補助 6 件、共 2,050 萬元，全數未執行</li>
<li>照相 APP 2022 年只辦 5 場訓練、251 人參加，未含農民；公所只把照片當佐證，不敢據以免勘</li>
<li>救助辦法 2017 年修正後已明定「勘查得以科學技術輔助之」</li>
<li>2017–2022 年預算累計 90.5 億元，實際支出 163.71 億元，六年中有五年超支</li><li>救助額度以平均生產成本約 2 成計算（農委會查復）；果樹類實際占比從 9.45% 到 74.44% 不等</li></ul>`});

ext('d-udn-ragasa',{title:'樺加沙：光復鄉全品項救助、溢流地段免勘',pub:'聯合報',date:'2025/9/24',

ext('d-ltn-wendan',{title:'丹娜絲延續性災損：台南文旦救助',pub:'自由時報',date:'2026/7/1',

ext('d-tn-pear',{title:'新北梨寒害現金救助',pub:'台灣英文新聞（新北市政府新聞）',date:'2025/3',

ext('d-ithome-ndvi',{title:'雲林縣用衛星 NDVI 試算災損熱區',pub:'iThome',date:'2026/10/8',
url:'https://www.ithome.com.tw/news/179527',body:`
<h2>做法</h2>
<ul><li>使用歐盟 Copernicus 的 Sentinel-2 影像（EO Browser 下載），以紅光 B04 與近紅外 B08 計算 NDVI</li>
<li>災前 2025/6/15、災後 2025/8/7，挑雲量少、完整覆蓋雲林的影像</li>
<li>Python 計算差值，QGIS 統一為 TWD97、依縣界裁切，只保留農地範圍像元</li>
<li>NDVI 差值小於 −0.15 為疑似植生衰退、小於 −0.25 為預測重災熱區（非法規標準）</li></ul>
<h2>結果與限制</h2>
<ul><li>衛星判出的衰退區與實際核定救助區重疊約 64%（分析丹娜絲與 0708 豪雨）</li>
<li>NDVI 下降只能篩出疑似熱區，無法單獨判定受災原因或法定損害程度，仍需現勘</li></ul>
<h2>雲林的勘災痛點</h2>
<ul><li>某次風災麻竹筍申請超過 1 萬筆，公所幾乎全員投入現勘仍難如期</li>
<li>古坑山區道路可能中斷，2025 年 9 月有勘災人員現勘時受傷送醫</li>
<li>2023–2025 年雲林農損約 19 億元、被害約 3 萬公頃</li>
<li>2019–2021 年農業部補助 300 萬元試辦無人機勘災，因基層擔心爭議、技術未成熟而未落地</li></ul>
<h2>雲林的提案</h2>
<ul><li>NDVI 差異圖可作為通報災情時的初判說明</li><li>若航測能可靠判釋作物類別，可作為免逐筆現勘的佐證，已送農業部研議</li><li>建議增訂高災損作物天氣參數，並新增 12 處氣象站</li></ul>
<p class="note">災後影像 8/7 距丹娜絲登陸（7/6）32 天，期間還有 0708、0728 兩場豪雨，所以這張差異圖無法分出是哪一場災害造成的。報導本身也說明 NDVI 只能篩出疑似熱區。</p>`});

ext('d-moa-app',{title:'農災 APP、天氣參數與農地資料庫',pub:'農業部',date:'2025–2026',
url:'https://www.moa.gov.tw/ws.php?id=2517236',body:`
<h2>現地照相 APP</h2>
<ul><li>每張照片自動套印拍攝時間、上傳時間、地段號與經緯度，須拍遠景與近景</li>
<li>一般手機 GPS 誤差約 ±20 公尺</li><li>每小時透過 API 同步到農業現調相片圖臺與農糧署救助系統</li>
<li>2025 年辦 64 場推廣講習、3,236 人參加（農民約 2,736 人）；2026 年規劃至少 90 場</li></ul>
<h2>天氣參數</h2>
<ul><li>農業氣象資料中心 2023 年起與中央氣象署合作，1 公里網格，災害期間每日自動更新 4 次</li>
<li>統計 3 小時、24 小時、3 日、5 日累積雨量與最大風速</li>
<li>例：西瓜中大果期 24 小時雨量 ≥ 280 毫米，或 3 日 ≥ 450 毫米且連 2 日每日 ≥ 100 毫米，即達災損參數</li>
<li>樺加沙期間，花蓮 8 個測站達西瓜災損指標</li></ul>
<h2>全國農地覆蓋物動態資料庫</h2>
<ul><li>以坵塊為單元掌握逾 30 萬公頃農地，已納入航遙測影像的作物判釋成果</li></ul>
<p class="note">這個資料庫是天相星最自然的對接點：災時在同一套坵塊上加入災前災後比對。</p>`});

ext('d-proof',{title:'種植客觀證明：實際問題與數據',pub:'監察院調查報告（依審計部 110 年度決算審核）；臺南市政府 Q&A',date:'2023/6/7；2025/8/12',
url:'https://cybsbox.cy.gov.tw/CYBSBoxSSL/edoc/download/61399',body:`
<h2>先講結論：有哪些數據、缺哪些數據</h2>
<ul><li><b>有</b>：2021 年 8 月豪雨的使用件數、撥款天數、各縣市沒採用的原因，以及審計部比對登錄資料後的錯誤率。這些全部出自同一份監察院調查報告。</li>
<li><b>沒有</b>：2025 年丹娜絲等事件中，用種植客觀證明免勘的件數、比例或問題統計，目前查不到公開資料。</li>
<li><b>沒有</b>：種植客觀證明「與實況不符」的整體比例。報告只有各縣市的文字反映，沒有全國數字。</li>
<li><b>無法核對</b>：2025 年 5 月農業部公告原文本頁讀不到，請見<a href="#d-moa-notice">該頁說明</a>。</li></ul>

<h2>什麼算種植客觀證明</h2>
<ul><li>監察院報告：種植或養殖「登記有案」的實耕證據</li>
<li>臺南市政府丹娜絲 Q&amp;A（2025/8/12）：須參與政策紀錄在案，例如產銷履歷、休耕轉作、救助紀錄；沒有的可用照相 App 上傳照片佐證</li></ul>

<h2>數據一：真正用上的很少（2021 年 8 月豪雨）</h2>
<div class="tw"><table><tr><th>案件類型</th><th>件數</th><th>占全部</th><th>平均撥款</th></tr>
<tr><td>有客觀證明，免勘查種植事實</td><td>5,932</td><td>2.8%</td><td>30 天</td></tr>
<tr><td>無客觀證明，視同具種植事實</td><td>1,716</td><td>0.8%</td><td>24 天</td></tr>
<tr><td>無客觀證明，現地勘查種植事實</td><td>67,535</td><td>32.3%</td><td>51 天</td></tr>
<tr><td>須現勘損失率的一般案件</td><td>134,006</td><td>64.1%</td><td>58 天</td></tr>
<tr><td>合計</td><td>209,189</td><td>100%</td><td>55 天</td></tr></table></div>
<p class="note">占比為本頁依報告件數計算。用了客觀證明的案件撥款快約一半，但只占 2.8%。</p>

<h2>數據二：各縣市差很多</h2>
<div class="tw"><table><tr><th>縣市</th><th>有客觀證明免勘件數</th><th>平均撥款</th></tr>
<tr><td>高雄市</td><td>2,972</td><td>21 天</td></tr><tr><td>臺南市</td><td>2,887</td><td>38 天</td></tr>
<tr><td>屏東縣</td><td>49</td><td>9 天</td></tr><tr><td>嘉義縣</td><td>24</td><td>70 天</td></tr>
<tr><td>彰化、雲林、苗栗、南投等</td><td>0</td><td>—</td></tr></table></div>

<h2>數據三：10 個縣市說明為什麼不用（原因摘要）</h2>
<ul><li>苗栗縣：農友會依喜好或市場改種，基層無法相信客觀文件，仍逐案到場</li>
<li>南投縣：發現有些農民今年並非種植或未種植該項目</li>
<li>彰化縣：客觀證明文件採認的期間太長，今年可能已改種或未種</li>
<li>雲林縣：豪雨時二期作約一半面積還沒種，照文件免勘可能造成「未種植也救助」</li>
<li>嘉義縣：系統查詢比對耗時，作物每期都可能變，且有未種植仍申報</li>
<li>嘉義市：農民未附產銷履歷等文件，公所核對比直接勘查更耗時</li>
<li>臺南市：短期作物的種植現況不一定與歷史資料相符</li>
<li>高雄市、屏東縣：初次辦理或已到鄰近田區，仍逐筆勘查</li></ul>

<h2>數據四：登錄資料和申報對不上的錯誤率</h2>
<div class="tw"><table><tr><th>審計部比對項目</th><th>回報件數</th><th>確屬錯誤</th></tr>
<tr><td>申請受災作物與契作作物不同</td><td>2,565</td><td>36 件（1.40%）</td></tr>
<tr><td>休耕或種綠肥仍申領救助</td><td>6,317</td><td>66 件（1.04%）</td></tr>
<tr><td>以同類中救助額度較高的作物申請</td><td>986</td><td>27 件（2.74%）</td></tr></table></div>
<p class="note">農委會說明：轉契作只登載「荔枝」，救助卻分「黑葉荔枝」「玉荷包」，兩套資料寫法不同，硬性勾稽會產生大量異常，所以沒有強制比對。</p>

<h2>數據五：簡化措施的風險</h2>
<ul><li>未達豪雨標準仍獲救助 36,059 件、2 億 6,153 萬元</li><li>其中免現勘 11,696 件（32.44%）、9,004 萬元</li><li>審計部認為簡化措施案件的誤報或虛報風險高於一般案件</li></ul>

<h2>對天相星的意義</h2>
<p>現行種植客觀證明是「登記資料」，記的是過去或申報的作物，不一定是災前那一天田裡真正長的東西，所以公所不敢信。衛星災前影像能直接補上「災前當下」這一點；但它能不能比登記資料更準，目前沒有數據，要靠原型與公所現勘比對才知道。</p>`});

ext('d-ltn-yangliu',{title:'楊柳颱風：主動公告花東中投雲嘉救助',pub:'自由時報',date:'2025/8/14',
url:'https://news.ltn.com.tw/news/life/breakingnews/5145325',body:`

ext('d-pts-gukeng',{title:'古坑竹林勘災：農災 App 只能佐證',pub:'公視新聞',date:'2023/5/31',
url:'https://news.pts.org.tw/article/639374',body:`
<ul><li>2023 年初雨水少，雲林古坑竹筍缺水大幅減產</li>
<li>部分竹林位在深山、不易勘查，無法立即存證，因此被判定不合格</li>
<li>雲林縣府農業處呼籲修訂辦法，開放照相 App 作為申報系統，以縮短勘查時間</li>
<li>農糧署副署長說明：App 資料是公告後的參考佐證，不是判定依據，實際救助仍需公所人員到場確認作物種類與損害程度</li>
<li>救助作業允許以科技工具輔助勘查，但區域統計仍須公所實地會勘</li></ul>
<p class="note">這是「人到不了的田，越容易失去救助」的直接案例，也說明新證據要取得效力，須經主管機關認可。</p>`});

ext('d-moa-notice',{title:'2025 年 5 月農業部公告：種植客觀證明與抽樣勘查',pub:'農業部公告（彰化縣政府轉載）',date:'2025/5',
url:'https://files.chcg.gov.tw/files/71_20250502104232659_農業部　公告.pdf',body:`
<p class="note">此公告 PDF 無法由本頁直接讀取，以下依本隊評估報告的整理，請以原始公告為準。</p>
<ul><li>達災損天氣參數或災損嚴重公告，且具種植客觀證明（含農災 App 照片）者，公所得免勘查</li>

D['d-team-plan']={kind:'team',title:'本隊文件：初步計劃、評估報告與創意構想書初稿',pub:'天相星團隊',date:'2026/10/19–10/20',body:`
<p class="note">本頁是團隊自己的規劃，屬「進度與主張」，不是外部事實；外部數據請見各來源頁。</p>
<h2>作品定位</h2>
<ul><li>災前災後衛星比對快篩平台：不改勘查制度，讓公所用同樣人力更快、更準完成勘查</li><li>報名創意組、題目六「偏鄉農林牧智慧連線與精準作業定位」；截止 2026/10/30 17:00</li></ul>
<h2>A／B／C 分級（建議起始值）</h2>
<div class="tw"><table><tr><th>分級</th><th>條件</th><th>處理</th></tr>
<tr><td>A 明確受損</td><td>估損 ≥ 40%，SAR 與光學一致，坵塊夠大、影像清楚</td><td>存證送件，走簡化措施</td></tr>
<tr><td>B 明確未受損</td><td>估損 ≤ 10%、影像無變化、未申報</td><td>不派人</td></tr>
<tr><td>C 爭議</td><td>10–40%、影像信心低、申報不一致、延遲性災損</td><td>列入公所優先現勘</td></tr></table></div>
<p>門檻需以丹娜絲等歷史災例校正。</p>
<h2>原型驗證計劃（尚未開始）</h2>
<ul><li>案例：2025 丹娜絲颱風，嘉義縣竹崎或中埔約 10×10 公里</li><li>資料：Sentinel-2 災前災後少雲影像；Sentinel-1 災前災後各一景</li><li>產出：災前災後對照圖、A／B／C 熱區示意圖、方法說明；標明為概念驗證，不宣稱精確度</li><li>工具：Copernicus Browser 或 Google Earth Engine</li></ul>
<h2>團隊狀態（10/20）</h2>
<ul><li>隊長＋已找到 1 名隊友；指導老師待詢問</li><li>構想書初稿已完成，隊伍名稱待填</li></ul>
<h2>商業模式</h2>
<ul><li>基礎版：農業部或縣市政府採購（轄區取像、A／B／C 分級、勘查清單）</li><li>進階版：農民訂閱（可由公所或農會補助）、產險公司或農會採購</li><li>救助金額與資格不因版本改變</li></ul>`};

rep('r-process',{title:'救助流程與法定時程',body:`
<ol><li>災害發生，公所查報，縣市彙整報農糧署</li><li>農業部公告救助地區與品項（可依速報主動公告）</li><li>農民於公告翌日起 10 日內申請</li><li>公所於公告翌日起 30 日內完成勘查</li><li>縣市於收件翌日起 7 日內抽查，最多兩次</li><li>農業部於收件翌日起 7 日內審核撥款</li></ol>
<p>申請到撥款法定合計 44 天；農委會另依作業要點算為公告後 58 天。救助門檻是單一品項損失率達 20%。</p>
<p>依據：時程見<a href="#d-cy-audit">監察院調查報告</a>、流程見<a href="#d-tp-flow">作業流程圖</a>、20% 門檻見<a href="#d-moa-20pct">救助公告</a></p>`});

/* ---------- render ---------- */
const stage=document.getElementById('stage'), vp=document.getElementById('vp'), det=document.getElementById('detail');
const prevB=document.getElementById('prev'), nextB=document.getElementById('next'), countEl=document.getElementById('count');
let cur=0;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function fit(){
  const w=vp.clientWidth, h=vp.clientHeight, pad=Math.min(24,w*0.02);
  const s=Math.min((w-pad*2)/1600,(h-pad*2)/900);
  stage.style.transform=`translate(${(w-1600*s)/2}px,${(h-900*s)/2}px) scale(${s})`;
}
function showSlide(i){
  cur=Math.max(0,Math.min(SLIDES.length-1,i));
  const s=SLIDES[cur];
  stage.innerHTML=`<section class="slide${s.inv?' inv':''}" aria-label="第 ${cur+1} 頁：${esc(s.t)}">${s.h}</section>`;
  countEl.textContent=(cur+1)+' / '+SLIDES.length;
  prevB.disabled=cur===0; nextB.disabled=cur===SLIDES.length-1;
}
function sourcesIndex(){
  const g=k=>Object.entries(D).filter(([,d])=>d.kind===k);
  return `<p>外部來源各整理成一頁並保留原始網址；調查報告依主題拆成小頁；團隊自己的規劃另列，與外部事實分開。</p>
<h2>外部來源（${g('ext').length}）</h2><ul>${g('ext').map(([k,d])=>`<li><a href="#${k}">${esc(d.title)}</a> <span class="meta">｜${esc(d.pub)}｜${esc(d.date)}</span></li>`).join('')}</ul>
<h2>調查報告分頁（${g('rep').length}）</h2><ul>${g('rep').map(([k,d])=>`<li><a href="#${k}">${esc(d.title)}</a></li>`).join('')}</ul>
<h2>團隊文件（${g('team').length}）</h2><ul>${g('team').map(([k,d])=>`<li><a href="#${k}">${esc(d.title)}</a></li>`).join('')}</ul>
<p class="meta">完整調查報告（線上文件）：<a href="${R}" target="_blank" rel="noopener">開啟 ↗</a></p>`;
}
function openDetail(id){
  const d = id==='r-sources' ? {kind:'rep',title:'所有依據',body:sourcesIndex()} : D[id];
  if(!d) return;
  const tag = d.kind==='ext'?'外部來源整理':d.kind==='team'?'團隊文件':'調查報告整理';
  const src = d.kind==='ext' ? `<div class="srcbox"><span class="meta">原始網址｜${esc(d.pub)}｜${esc(d.date)}</span><a href="${d.url}" target="_blank" rel="noopener">開啟原始網頁 ↗</a><span class="u">${esc(d.url)}</span></div>` : '';
  const back=`<button class="btn" data-back>← 回到第 ${cur+1} 頁（Esc）</button>`;
  det.innerHTML=`<div class="sheet"><div class="backrow">${back}<button class="btn" data-go="r-sources">所有依據</button></div>
   <span class="tag ${d.kind==='ext'?'ext':''}">${tag}</span><h1>${esc(d.title)}</h1>
   ${d.kind==='ext'?`<p class="meta">${esc(d.pub)}｜${esc(d.date)}｜以下為重點整理，非原文轉載</p>`:''}
   ${d.body}${src}<div class="backrow">${back}</div></div>`;
  det.hidden=false; det.scrollTop=0; det.focus({preventScroll:true});
}
function closeDetail(){ det.hidden=true; det.innerHTML=''; window.focus(); }
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-back]'); if(b){e.preventDefault();closeDetail();return;}
  const g=e.target.closest('[data-go]'); if(g){e.preventDefault();openDetail(g.dataset.go);return;}
  const a=e.target.closest('a[href^="#"]');
  if(a){e.preventDefault();openDetail(a.getAttribute('href').slice(1));}
});
prevB.onclick=()=>showSlide(cur-1); nextB.onclick=()=>showSlide(cur+1);
document.getElementById('all').onclick=()=>openDetail('r-sources');
window.addEventListener('keydown',e=>{
  if(!det.hidden){ if(e.key==='Escape'||e.key==='Backspace'){e.preventDefault();closeDetail();} return; }
  if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();showSlide(cur+1);}
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();showSlide(cur-1);}
  else if(e.key==='Home'){e.preventDefault();showSlide(0);}
  else if(e.key==='End'){e.preventDefault();showSlide(SLIDES.length-1);}
});
window.addEventListener('resize',fit);
if(window.ResizeObserver) new ResizeObserver(fit).observe(vp);
document.addEventListener('pointerdown',()=>{ if(det.hidden) window.focus(); });
const h0=(location.hash||'').slice(1), m=/^s(\d+)$/.exec(h0);
showSlide(m?parseInt(m[1],10)-1:0); fit(); window.focus();
if(/^(d|r)-/.test(h0)) openDetail(h0);
</script>
