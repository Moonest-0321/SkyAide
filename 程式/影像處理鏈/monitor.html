<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天相星 影像處理鏈監看</title>
<style>
:root {
  --navy: #15213b; --navy-2: #24345a; --ink: #1b2233; --ink-2: #4a5468; --ink-3: #5f6a7f;
  --line: #dfe2e8; --line-2: #eceef2; --bg: #f4f3ef; --card: #fff;
  --ok: #1d6b43; --ok-bg: #e3f2e9; --warn: #8a5a00; --warn-bg: #fdf1d6; --bad: #a63a12; --bad-bg: #fbe7de;
  --run: #1f4fae; --run-bg: #e7eefb; --idle: #8a93a6;
  --font: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.55 var(--font); }
h1, h2, h3 { margin: 0; line-height: 1.3; }
p { margin: 0; }
button { font: inherit; }
:focus-visible { outline: 3px solid #6b8fe0; outline-offset: 2px; }
header.top { background: var(--navy); color: #fff; display: flex; align-items: center; gap: 16px; padding: 10px 20px; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
.brand strong { font-size: 19px; margin-right: 8px; }
.brand span { color: #c9d1e3; }
.top select { background: var(--navy-2); color: #fff; border: 1px solid #3c4d74; border-radius: 8px; padding: 5px 8px; min-height: 34px; font: inherit; max-width: 100%; }
.top .meta { color: #d6dcea; font-size: 13px; display: flex; gap: 14px; flex-wrap: wrap; }
.pill { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.s-ok { background: var(--ok-bg); color: var(--ok); } .s-warn { background: var(--warn-bg); color: var(--warn); }
.s-stop, .s-error { background: var(--bad-bg); color: var(--bad); } .s-running { background: var(--run-bg); color: var(--run); }
.s-idle { background: var(--line-2); color: var(--ink-3); } .s-done { background: var(--ok-bg); color: var(--ok); } .s-stopped { background: var(--bad-bg); color: var(--bad); }
.wrap { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 56px); }
aside { border-right: 1px solid var(--line); background: #efeee9; padding: 14px 12px; position: sticky; top: 56px; height: calc(100vh - 56px); overflow: auto; }
.lane { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.lane li button { width: 100%; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 9px 10px 9px 14px; cursor: pointer; display: grid; gap: 2px; position: relative; }
.lane li button::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 4px; border-radius: 0 3px 3px 0; background: var(--idle); }
.lane li.ok button::before { background: var(--ok); } .lane li.warn button::before { background: #d39a1c; }
.lane li.stop button::before, .lane li.error button::before { background: var(--bad); } .lane li.running button::before { background: var(--run); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.lane li.on button { border-color: var(--navy); box-shadow: 0 0 0 1px var(--navy); }
.lane .k { font-weight: 700; } .lane .t { color: var(--ink-2); font-size: 13px; } .lane .x { color: var(--ink-3); font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
.lane .arrow { text-align: center; color: var(--ink-3); font-size: 11px; line-height: 1; }
main { padding: 18px 24px 60px; min-width: 0; outline: none; }
main > * + * { margin-top: 14px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 9px 14px; cursor: pointer; color: var(--ink-2); min-height: 42px; }
.tab.on { color: var(--navy); border-bottom-color: var(--navy); font-weight: 700; }
.tab .n { background: var(--bad-bg); color: var(--bad); border-radius: 999px; padding: 0 7px; font-size: 12px; margin-left: 6px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-width: 0; }
.card > * + * { margin-top: 10px; }
.card h2 { font-size: 17px; } .card h3 { font-size: 15px; }
.muted { color: var(--ink-3); } .small { font-size: 12px; }
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.head h1 { font-size: 22px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { background: var(--line-2); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
.metrics { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.metric { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fff; }
.metric .v { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.metric .v small { font-size: 12px; font-weight: 400; color: var(--ink-3); margin-left: 4px; }
.metric.ok { border-color: var(--ok); } .metric.bad { border-color: var(--bad); }
.metric .sim { color: var(--run); }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; background: #f7f7f5; padding: 7px 10px; border-bottom: 2px solid var(--ink); white-space: nowrap; color: var(--ink-2); }
td { padding: 7px 10px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.pass { color: var(--ok); font-weight: 700; } td.fail { color: var(--bad); font-weight: 700; } td.info { color: var(--ink-3); }
.imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 12px; }
figure { margin: 0; border: 1px solid var(--line); border-radius: 10px; padding: 8px; background: #fff; }
figure img { width: 100%; height: auto; display: block; cursor: zoom-in; }
figcaption { font-size: 12px; color: var(--ink-2); margin-top: 4px; }
.warnlist { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.log { background: #1b2233; color: #d6dcea; border-radius: 10px; padding: 10px 12px; font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; max-height: 260px; overflow: auto; }
.overview { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.ov { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: #fff; cursor: pointer; text-align: left; display: grid; gap: 4px; }
.ov:hover { border-color: var(--navy); }
.search { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.search input, .search select { font: inherit; border: 1px solid #c9ced8; border-radius: 8px; padding: 6px 10px; min-height: 36px; }
.btn { border: 1px solid #c9ced8; background: #fff; border-radius: 8px; padding: 6px 12px; cursor: pointer; min-height: 36px; }
.btn.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
.trail { display: grid; gap: 10px; }
.kv { display: grid; grid-template-columns: minmax(120px, auto) 1fr; gap: 4px 14px; margin: 0; font-size: 13px; }
.kv dt { color: var(--ink-3); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.chain { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.chain li { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: #fff; font-size: 12px; display: grid; gap: 2px; }
.chain code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; overflow-wrap: anywhere; color: var(--ink-2); }
.chain .bad { color: var(--bad); font-weight: 700; } .chain .good { color: var(--ok); font-weight: 700; }
.zoom { position: fixed; inset: 0; background: rgba(15,20,35,.8); display: grid; place-items: center; z-index: 20; padding: 20px; cursor: zoom-out; }
.zoom img { max-width: 100%; max-height: 100%; background: #fff; border-radius: 8px; }
.empty { border: 1px dashed #c9ced8; border-radius: 12px; padding: 30px; text-align: center; color: var(--ink-3); background: #fbfbf9; }
svg.spark { width: 100%; height: auto; background: #f7f8f4; border-radius: 8px; }
@media (max-width: 900px) {
  .wrap { grid-template-columns: 1fr; }
  aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .lane { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .lane .arrow { display: none; }
  .imgs { grid-template-columns: 1fr; }
  main { padding: 14px 14px 40px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><strong>天相星</strong><span>影像處理鏈監看</span></div>
  <select id="runSel" aria-label="選擇執行紀錄"></select>
  <span id="runStatus" class="pill s-idle">—</span>
  <div class="meta" id="runMeta"></div>
</header>
<div class="wrap">
  <aside><ol class="lane" id="lane" aria-label="處理步驟"></ol></aside>
  <main id="main" tabindex="-1"></main>
</div>

<script src="runs/index.js"></script>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const h = (tag, attrs, ...kids) => {
    const el = document.createElement(tag);
    for (const k in attrs || {}) {
      const v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') el.className = v; else if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v === true ? '' : v);
    }
    const add = (c) => { if (c === null || c === undefined || c === false) return; if (Array.isArray(c)) c.forEach(add); else el.appendChild(c instanceof Node ? c : document.createTextNode(String(c))); };
    kids.forEach(add);
    return el;
  };
  const fmt = (v) => (v === null || v === undefined || v === '' ? '—' : typeof v === 'number' ? (Number.isInteger(v) ? v.toLocaleString() : (Math.round(v * 1000) / 1000).toLocaleString()) : typeof v === 'object' ? JSON.stringify(v) : String(v));
  const STATUS = { ok: '完成', warn: '有警示', stop: '停止', error: '錯誤', running: '執行中', idle: '未開始', done: '完成', stopped: '已停止' };
  const GR = { A_MET: 'A 達標', A_NOT_MET: 'A 未達標', B: 'B 邊緣', C: 'C 缺失' };

  let RUN = null, runId = null, view = { tab: 'flow', stage: null, parcel: null }, timer = null;

  function loadRun(id) {
    runId = id;
    const old = document.getElementById('runData'); if (old) old.remove();
    window.SKY_RUN = null;
    const s = document.createElement('script');
    s.id = 'runData'; s.src = 'runs/' + encodeURIComponent(id) + '/monitor_data.js?t=' + Date.now();
    s.onload = () => { RUN = window.SKY_RUN; render(); schedule(); };
    s.onerror = () => { $('#main').innerHTML = ''; $('#main').appendChild(h('div', { class: 'empty' }, '讀不到這次的紀錄：runs/' + id + '/monitor_data.js')); };
    document.body.appendChild(s);
  }
  function schedule() { clearTimeout(timer); if (RUN && RUN.status === 'running') timer = setTimeout(() => loadRun(runId), 2000); }

  function stagesAll() {
    const done = {}; (RUN.stages || []).forEach((s) => { done[s.key] = s; });
    return (RUN.meta.stages || []).map((m) => done[m.key] || Object.assign({ status: 'idle', checks: [], metrics: [], images: [], tables: [], warnings: [], log: [], counts: {} }, m));
  }
  const failed = (s) => (s.checks || []).filter((c) => !c.passed && c.severity !== 'info');

  function renderTop() {
    const st = $('#runStatus'); st.className = 'pill s-' + RUN.status; st.textContent = STATUS[RUN.status] || RUN.status;
    const m = RUN.meta;
    const meta = $('#runMeta'); meta.innerHTML = '';
    [['來源', m.source === 'synthetic' ? '模擬資料（地真值已知）' : m.source], ['事件', m.event], ['範圍', m.aoi], ['雷達到站', m.radar_arrival],
     ['運算', RUN.seconds !== null && RUN.seconds !== undefined ? RUN.seconds + ' 秒' : '進行中'], ['出件目標', '到站後 ' + m.sla_hours + ' 小時內']]
      .forEach(([k, v]) => meta.appendChild(h('span', null, k + '：', h('strong', null, fmt(v)))));
  }

  function renderLane() {
    const lane = $('#lane'); lane.innerHTML = '';
    stagesAll().forEach((s, i) => {
      const f = failed(s).length;
      if (i) lane.appendChild(h('li', { class: 'arrow', 'aria-hidden': 'true' }, '↓'));
      lane.appendChild(h('li', { class: s.status + (view.tab === 'stage' && view.stage === s.key ? ' on' : '') },
        h('button', { onclick: () => { view = { tab: 'stage', stage: s.key }; render(); } },
          h('span', { class: 'k' }, s.key, '　', h('span', { class: 'pill s-' + s.status }, STATUS[s.status])),
          h('span', { class: 't' }, s.title),
          h('span', { class: 'x' }, s.seconds !== null && s.seconds !== undefined ? s.seconds + ' 秒' : '', (s.checks || []).length ? '檢核 ' + ((s.checks.length - f) + '/' + s.checks.length) : '', f ? h('span', { style: 'color:var(--bad)' }, f + ' 未過') : ''))));
    });
  }

  function tabs() {
    const warnN = stagesAll().reduce((a, s) => a + failed(s).length, 0);
    const t = [['flow', '流程總覽'], ['alerts', '警示', warnN], ['parcel', '坵塊追蹤'], ['ledger', '作業日誌']];
    return h('div', { class: 'tabs', role: 'tablist' }, t.map(([k, label, n]) => h('button', { class: 'tab' + ((view.tab === k || (k === 'flow' && view.tab === 'stage')) ? ' on' : ''), role: 'tab', onclick: () => { view = { tab: k }; render(); } }, label, n ? h('span', { class: 'n' }, n) : null)));
  }

  // ---------------- 流程總覽 ----------------
  function flow(main) {
    main.appendChild(h('div', { class: 'card' }, h('h2', null, '每一步的狀態'),
      h('p', { class: 'muted' }, '點左側或下方任一步，看檢核點、指標、圖與紀錄。執行中每 2 秒自動更新。'),
      h('div', { class: 'overview' }, stagesAll().map((s) => {
        const c = s.counts || {};
        return h('button', { class: 'ov', onclick: () => { view = { tab: 'stage', stage: s.key }; render(); } },
          h('span', null, h('strong', null, s.key), '　', h('span', { class: 'pill s-' + s.status }, STATUS[s.status])),
          h('span', null, s.title), h('span', { class: 'muted small' }, Object.entries(c).slice(0, 4).map(([k, v]) => k + ' ' + fmt(v)).join('・') || s.spec || ''));
      }))));
    if (RUN.error) main.appendChild(h('div', { class: 'card', style: 'border-color:var(--bad)' }, h('h2', { style: 'color:var(--bad)' }, '流程停止'), h('p', null, RUN.error)));
  }

  // ---------------- 單一步驟 ----------------
  function stage(main, key) {
    const s = stagesAll().find((x) => x.key === key); if (!s) return;
    main.appendChild(h('div', { class: 'head' }, h('div', null, h('p', { class: 'muted' }, s.key), h('h1', null, s.title), h('p', { class: 'muted' }, s.spec)),
      h('div', { class: 'chips' }, h('span', { class: 'pill s-' + s.status }, STATUS[s.status]), s.seconds !== undefined && s.seconds !== null ? h('span', { class: 'chip' }, s.seconds + ' 秒') : null,
        Object.entries(s.counts || {}).map(([k, v]) => h('span', { class: 'chip' }, k + ' ' + fmt(v))))));
    if ((s.checks || []).length) main.appendChild(h('div', { class: 'card' }, h('h2', null, '檢核點'),
      table(['結果', '檢核', '說明', '未通過時', '依據'], s.checks.map((c) => [
        { v: c.passed ? '通過' : (c.severity === 'info' ? '注意' : '未過'), cls: c.passed ? 'pass' : (c.severity === 'info' ? 'info' : 'fail') },
        c.name, c.detail, c.passed ? '' : (c.action || (c.severity === 'stop' ? '停止計算' : '')), c.basis || '']))));
    if ((s.metrics || []).length) main.appendChild(h('div', { class: 'card' }, h('h2', null, '指標'),
      h('div', { class: 'metrics' }, s.metrics.map((m) => h('div', { class: 'metric' + (m.ok === true ? ' ok' : m.ok === false ? ' bad' : '') },
        h('p', { class: 'small ' + (m.name.startsWith('（模擬') ? 'sim' : 'muted') }, m.name),
        h('p', { class: 'v' }, fmt(m.value), m.unit ? h('small', null, m.unit) : null),
        m.target ? h('p', { class: 'small muted' }, '目標：' + m.target) : null, m.note ? h('p', { class: 'small muted' }, m.note) : null)))));
    if ((s.images || []).length) main.appendChild(h('div', { class: 'card' }, h('h2', null, '中間成果'),
      h('div', { class: 'imgs' }, s.images.map((im) => h('figure', null, h('img', { src: 'runs/' + runId + '/' + im.src, alt: im.name, onclick: () => zoom('runs/' + runId + '/' + im.src) }), h('figcaption', null, h('strong', null, im.name), im.caption ? '　' + im.caption : ''))))));
    (s.tables || []).forEach((t) => main.appendChild(h('div', { class: 'card' }, h('h2', null, t.name), t.note ? h('p', { class: 'muted small' }, t.note) : null, table(t.columns, t.rows, true))));
    if ((s.warnings || []).length) main.appendChild(h('div', { class: 'card' }, h('h2', null, '警示'), h('ul', { class: 'warnlist' }, s.warnings.map((w) => h('li', null, w)))));
    if ((s.log || []).length) main.appendChild(h('div', { class: 'card' }, h('h2', null, '執行紀錄'), h('div', { class: 'log' }, s.log.join('\n'))));
  }

  function table(cols, rows, parcelLinks) {
    return h('div', { class: 'tbl-wrap' }, h('table', null, h('thead', null, h('tr', null, cols.map((c) => h('th', null, c)))),
      h('tbody', null, rows.length ? rows.map((r) => h('tr', null, r.map((c, i) => {
        if (c && typeof c === 'object' && 'v' in c) return h('td', { class: c.cls }, c.v);
        if (parcelLinks && i === 0 && /^坵塊$/.test(cols[0]) && RUN.parcels[String(c)]) return h('td', null, h('button', { class: 'btn', onclick: () => { view = { tab: 'parcel', parcel: String(c) }; render(); } }, c));
        return h('td', null, fmt(c));
      }))) : h('tr', null, h('td', { colspan: cols.length, class: 'muted' }, '（無）')))));
  }

  function zoom(src) { const z = h('div', { class: 'zoom', onclick: () => z.remove() }, h('img', { src, alt: '放大' })); document.body.appendChild(z); }

  // ---------------- 警示 ----------------
  function alerts(main) {
    const all = [];
    stagesAll().forEach((s) => {
      (s.checks || []).filter((c) => !c.passed).forEach((c) => all.push([s.key, c.severity === 'stop' ? '停止' : c.severity === 'info' ? '注意' : '警示', c.name, c.detail, c.action || '']));
      (s.warnings || []).filter((w) => !w.startsWith('檢核未過')).forEach((w) => all.push([s.key, '警示', w, '', '']));
    });
    main.appendChild(h('div', { class: 'card' }, h('h2', null, '全部警示與未通過的檢核'), h('p', { class: 'muted' }, '「停止」會中止流程；「警示」依處理方式繼續；「注意」只記錄。'),
      table(['步驟', '層級', '項目', '說明', '處理'], all)));
  }

  // ---------------- 坵塊追蹤 ----------------
  function parcel(main) {
    const ids = Object.keys(RUN.parcels || {}).sort((a, b) => a - b);
    const sel = h('select', { 'aria-label': '坵塊', onchange: (e) => { view.parcel = e.target.value; render(); } },
      ids.map((id) => { const g = (RUN.parcels[id].S4 || {}).grade; return h('option', { value: id, selected: view.parcel === id ? true : null }, id + '　' + ((RUN.parcels[id]['S3-2'] || {}).land_no || '') + (g ? '　' + GR[g] : '')); }));
    const filt = h('select', { 'aria-label': '篩選', onchange: (e) => { const g = e.target.value; const first = ids.find((id) => g === 'all' || (RUN.parcels[id].S4 || {}).grade === g); if (first) { view.parcel = first; render(); } } },
      h('option', { value: 'all' }, '跳到…'), Object.entries(GR).map(([k, v]) => h('option', { value: k }, '第一筆 ' + v)));
    main.appendChild(h('div', { class: 'card' }, h('h2', null, '單一坵塊在各步的紀錄'), h('div', { class: 'search' }, sel, filt)));
    if (!ids.length) { main.appendChild(h('div', { class: 'empty' }, '還沒有坵塊紀錄（S3-2 之後才有）')); return; }
    const id = view.parcel || ids[0]; view.parcel = id;
    const P = RUN.parcels[id] || {};
    const T = (RUN.truth || {})[id];
    const wrap = h('div', { class: 'trail' });
    if (T) wrap.appendChild(h('div', { class: 'card', style: 'border-color:var(--run)' }, h('h3', { style: 'color:var(--run)' }, '（模擬）地真值：處理鏈看不到，只用來對答案'),
      kv([['作物', T.crop], ['災害', T.damage], ['真實損失', T.loss !== null && T.loss !== undefined ? T.loss + '%' : null], ['不實申請', T.claim], ['地籍偏移', T.misreg && (T.misreg[0] || T.misreg[1]) ? T.misreg.join(', ') + ' 格' : '無'], ['插秧灌水中', T.transplant ? '是' : '否']])));
    const ser = (RUN.series || {})[id];
    if (ser) wrap.appendChild(h('div', { class: 'card' }, h('h3', null, '平時累積的時序（HISTORY）'), spark(ser), h('p', { class: 'small muted' }, '綠：NDVI（過去 3 年，雲遮缺值）；藍：VH dB（過去一年）。右端為災害。')));
    const s32 = P['S3-2'];
    if (s32) wrap.appendChild(h('div', { class: 'card' }, h('h3', null, 'S3-2 坵塊化'),
      kv([['地號', s32.land_no], ['種類', s32.kind === 'pond' ? '魚塭' : '農田'], ['登記／有效種植', s32.reg_ha + '／' + s32.eff_ha + ' 公頃'], ['內縮後格數', s32.n_inset + (s32.needs_hr ? '（不足 5 格）' : '')],
        ['圖解地籍', s32.graphic ? '是' : '否'], ['對位', s32.misreg ? '不確定（混入鄰田 ' + Math.round(s32.mix_frac * 100) + '%）' : '可靠'], ['陰影疊置', Math.round((s32.shadow_frac || 0) * 100) + '%']]),
      table(['來源', '角色', '日', 'VV', 'VH', 'NDVI', 'MNDWI', '清晰', '旗標'], (s32.table || []).map((r) => [r.src, r.role || '', r.day, r.vv, r.vh, r.ndvi, r.mndwi, r.clear, r.flag || '']))));
    const s33 = P['S3-3'];
    if (s33) wrap.appendChild(h('div', { class: 'card' }, h('h3', null, 'S3-3 影像判讀'),
      kv([['淹水比例', s33.flood], ['倒伏中度／嚴重', fmt(s33.lodge_mod) + '／' + fmt(s33.lodge_sev)], ['VH 變化', s33.vh_ratio !== null ? fmt(s33.vh_ratio) + ' dB' : null], ['埋沒比例', s33.buried],
        ['NDVI 比去年同期多降', s33.veg_anom], ['植生標準分數', s33.veg_z], ['災後雲遮', s33.cloud_post], ['作物判釋', s33.crop_pred ? s33.crop_pred + '（' + fmt(s33.crop_prob) + '）' : null],
        ['疑似灌溉', s33.irrigation ? '是' : '否'], ['高解析倒伏', s33.hr_lodge], ['L1–L4', s33.hist ? ['L1', 'L2', 'L3', 'L4'].map((k) => k + (s33.hist[k] === false ? '✗' : '✓')).join(' ') : null],
        ['魚塭：水面 前／後', s33.water_pre !== undefined ? fmt(s33.water_pre) + '／' + fmt(s33.water_post) : null], ['停電天數', s33.outage_days]].filter((x) => x[1] !== undefined))));
    const s34 = P['S3-4'];
    if (s34) wrap.appendChild(h('div', { class: 'card' }, h('h3', null, 'S3-4 損失區間'), ivbar(s34),
      kv([['第 10／50／90 百分位', s34.p10 + '／' + s34.p50 + '／' + s34.p90 + '%'], ['達 20% 的機率', Math.round(s34.p_ge20 * 100) + '%'], ['半經驗損傷函數', s34.semi + '%'], ['影響判定最多的特徵', (s34.top || []).join('；')]])));
    const s4 = P.S4;
    if (s4) {
      const box = h('div', { class: 'card' }, h('h3', null, 'S4 案件分級'));
      if (!s4.grade) box.appendChild(h('p', null, s4.note || '未列入分級'));
      else {
        box.appendChild(kv([['分級', GR[s4.grade]], ['可信度', s4.credibility], ['類別等級', s4.level], ['原因碼', (s4.reasons || []).join('、')], ['元件門檻', (s4.notes || []).join('、')]]));
        if (s4.checks) box.appendChild(table(['檢核', '結果', '說明'], Object.entries(s4.checks).map(([k, v]) => [{ imagery: '影像條件', completeness: '觀測完整', consistency: '多源一致', declaration: '申報一致', production: '生產事實', stock: '放養申報' }[k] || k, { v: v.pass_ ? '通過' : '未過：' + (v.reasons || []).join('、'), cls: v.pass_ ? 'pass' : 'fail' }, v.detail])));
        if (s4.r) box.appendChild(table(['規則', '結果', '說明'], Object.entries(s4.r).map(([k, v]) => [k, { v: v.status, cls: v.status === '一致' ? 'pass' : 'fail' }, v.note])));
      }
      wrap.appendChild(box);
    }
    if (P.S5) wrap.appendChild(h('div', { class: 'card' }, h('h3', null, 'S5 存證報告'), kv([['報告編號', P.S5.no], ['查驗碼', P.S5.verify_code], ['SHA-256', P.S5.hash], ['簽章', P.S5.signature]])));
    if (P.S7) wrap.appendChild(h('div', { class: 'card' }, h('h3', null, 'S7 現勘回填'), kv([['現勘損失', P.S7.survey_loss + '%'], ['現勘作物', P.S7.survey_crop], ['回填原因', P.S7.reason]])));
    main.appendChild(wrap);
  }

  function kv(pairs) { return h('dl', { class: 'kv' }, pairs.map(([k, v]) => [h('dt', null, k), h('dd', null, fmt(v))])); }

  function ivbar(s) {
    const NS = 'http://www.w3.org/2000/svg';
    const e = (t, a) => { const x = document.createElementNS(NS, t); for (const k in a) x.setAttribute(k, a[k]); return x; };
    const svg = e('svg', { viewBox: '0 0 400 46', class: 'spark', role: 'img', 'aria-label': '損失區間' });
    const X = (v) => 10 + v * 3.8;
    svg.appendChild(e('rect', { x: 10, y: 18, width: 380, height: 8, fill: '#e6e8ec', rx: 4 }));
    svg.appendChild(e('rect', { x: X(s.p10), y: 14, width: Math.max(2, X(s.p90) - X(s.p10)), height: 16, fill: '#8fa9dd', rx: 6 }));
    svg.appendChild(e('rect', { x: X(s.p50) - 1.5, y: 10, width: 3, height: 24, fill: '#15213b' }));
    [[10, '#5b3f9e'], [20, '#1b2233'], [40, '#1d6b43']].forEach(([v, c]) => { svg.appendChild(e('rect', { x: X(v) - 1, y: 8, width: 2, height: 28, fill: c })); const t = e('text', { x: X(v), y: 45, 'font-size': 9, 'text-anchor': 'middle', fill: c }); t.textContent = v + '%'; svg.appendChild(t); });
    return svg;
  }

  function spark(ser) {
    const NS = 'http://www.w3.org/2000/svg';
    const e = (t, a) => { const x = document.createElementNS(NS, t); for (const k in a) x.setAttribute(k, a[k]); return x; };
    const W = 800, H = 160, d0 = ser.nd_days[0];
    const X = (d) => 10 + (d - d0) / (0 - d0) * (W - 20);
    const svg = e('svg', { viewBox: `0 0 ${W} ${H}`, class: 'spark', role: 'img', 'aria-label': '時序' });
    let p = ''; ser.nd_days.forEach((d, i) => { const v = ser.ndvi[i]; if (v === null) return; const y = H - 10 - v * (H - 20); p += (p ? 'L' : 'M') + X(d).toFixed(1) + ' ' + y.toFixed(1); svg.appendChild(e('circle', { cx: X(d), cy: y, r: 1.6, fill: '#2e7d4f' })); });
    svg.appendChild(e('path', { d: p, fill: 'none', stroke: '#2e7d4f', 'stroke-width': 1 }));
    let q = ''; ser.vh_days.forEach((d, i) => { const v = ser.vh[i]; const y = H - 10 - ((v + 30) / 20) * (H - 20); q += (q ? 'L' : 'M') + X(d).toFixed(1) + ' ' + y.toFixed(1); });
    svg.appendChild(e('path', { d: q, fill: 'none', stroke: '#2f6fdb', 'stroke-width': 1.4 }));
    svg.appendChild(e('line', { x1: X(0) - 1, x2: X(0) - 1, y1: 5, y2: H - 5, stroke: '#b23b1e', 'stroke-width': 2 }));
    return svg;
  }

  // ---------------- 作業日誌 ----------------
  function ledger(main) {
    const L = RUN.ledger || [];
    let prev = '0'.repeat(64), ok = true;
    const items = L.map((e, i) => {
      const linked = e.prev === prev; ok = ok && linked; prev = e.hash;
      return h('li', null, h('span', null, h('strong', null, (i + 1) + '. ' + e.stage), '　', e.at, '　', h('span', { class: linked ? 'good' : 'bad' }, linked ? '鏈結相符' : '鏈結斷開')),
        h('code', null, 'prev ' + e.prev), h('code', null, 'hash ' + e.hash), h('span', { class: 'muted' }, '狀態 ' + (STATUS[e.summary.status] || e.summary.status) + '；' + Object.entries(e.summary.counts || {}).map(([k, v]) => k + ' ' + v).join('、')));
    });
    main.appendChild(h('div', { class: 'card' }, h('h2', null, '作業日誌（雜湊鏈）'),
      h('p', { class: 'muted' }, '每一步完成寫一筆，每筆記下前一筆的雜湊；刪改任何一筆，其後的鏈結就斷開。此處檢查鏈結，完整重算在 S8 以程式執行。原始檔：runs/' + runId + '/ledger.jsonl'),
      h('p', null, '鏈結檢查：', h('strong', { style: 'color:' + (ok ? 'var(--ok)' : 'var(--bad)') }, ok ? '全部相符' : '有斷開')),
      h('ol', { class: 'chain' }, items)));
  }

  function render() {
    if (!RUN) return;
    renderTop(); renderLane();
    const main = $('#main'); main.innerHTML = '';
    main.appendChild(tabs());
    if (view.tab === 'stage') stage(main, view.stage);
    else if (view.tab === 'alerts') alerts(main);
    else if (view.tab === 'parcel') parcel(main);
    else if (view.tab === 'ledger') ledger(main);
    else flow(main);
  }

  const runs = window.SKY_RUNS || [];
  const sel = $('#runSel');
  if (!runs.length) {
    sel.appendChild(h('option', null, '尚無執行紀錄'));
    $('#main').appendChild(h('div', { class: 'empty' }, '還沒有執行紀錄。先執行 python run.py，再重新整理這一頁。'));
  } else {
    runs.forEach((r) => sel.appendChild(h('option', { value: r.id }, r.id + '　' + (STATUS[r.status] || r.status))));
    sel.addEventListener('change', (e) => { view = { tab: 'flow' }; loadRun(e.target.value); });
    loadRun(runs[0].id);
  }
})();
</script>
</body>
